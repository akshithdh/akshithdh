      <stop offset="0%" stop-color="#2a4093" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#273879" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fbfbfc" stop-opacity="0"/>
